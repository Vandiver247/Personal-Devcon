name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Build and test
        run: just test
        env:
          GITHUB_TOKEN: ${{ github.token }}
