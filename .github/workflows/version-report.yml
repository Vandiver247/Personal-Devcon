name: Version report

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: version-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report:
    name: Report outdated tools
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      # Same mise version as the image, read from the Dockerfile.
      - name: Install mise
        run: |
          version="$(grep -oP '^ARG MISE_VERSION=\K\S+' Dockerfile)"
          sudo curl -fsSL -o /usr/local/bin/mise \
            "https://github.com/jdx/mise/releases/download/v${version}/mise-v${version}-linux-x64"
          sudo chmod 0755 /usr/local/bin/mise
          mise --version

      - name: Generate report
        run: |
          just outdated > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # Informational only: updates the existing report comment instead of adding a new one.
      - name: Comment on pull request
        run: scripts/pr_comment.sh "$PR_NUMBER" report.md
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
