name: Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"

      # Fails on any CRITICAL finding, or any HIGH finding with a fix available.
      - name: Build and scan image
        run: just scan

      - name: Comment on pull request
        if: always() && hashFiles('trivy-report.md') != ''
        run: |
          cat trivy-report.md >> "$GITHUB_STEP_SUMMARY"
          scripts/pr_comment.sh "$PR_NUMBER" trivy-report.md
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload full results
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: trivy-results.json
