name: Scheduled build

# Weekly rebuild from scratch, so the published image picks up base image and
# apt package updates even when nothing in the repository changes.
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: vandiver247/personal-devcon

# Shares the Publish workflow's group so the two never push at the same time.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild, check and push image (${{ matrix.arch }})
    # Each architecture builds and tests on a native runner. If either fails,
    # the manifest job is skipped and `latest` keeps pointing at the previous images.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The Docker Hub secrets live in this environment, which only runs from `main`.
    environment: dockerhub
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `just push` builds, tests, then pushes ${{ env.IMAGE }}:latest-${{ matrix.arch }}.
      - name: Build, test and push
        run: just push

      # Informational: findings are reported in the summary but never block the publish.
      # Reuses the image built above.
      - name: Scan image
        run: just scan
        continue-on-error: true

      - name: Add scan report to summary
        if: always() && hashFiles('trivy-report.md') != ''
        run: cat trivy-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full scan results
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results-${{ matrix.arch }}
          path: trivy-results.json

  manifest:
    name: Publish multi-arch manifest
    needs: rebuild
    runs-on: ubuntu-latest
    # The Docker Hub secrets live in this environment, which only runs from `main`.
    environment: dockerhub
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Points ${{ env.IMAGE }}:latest at both images, then checks it lists both platforms.
      - name: Create and verify manifest
        run: just manifest
