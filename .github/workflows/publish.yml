name: Publish

on:
  push:
    branches: [main]
    # Only the files that go into the image: a push that touches nothing else
    # (workflows, .devcontainer, README, scripts) does not rebuild or publish.
    paths:
      - Dockerfile
      - .dockerignore
      - mise.toml
      - nvim/**

permissions:
  contents: read

env:
  IMAGE: vandiver247/personal-devcon

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and push image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `just push` builds, tests, then pushes ${{ env.IMAGE }}:latest.
      - name: Build, test and push
        run: just push
        env:
          GITHUB_TOKEN: ${{ github.token }}
